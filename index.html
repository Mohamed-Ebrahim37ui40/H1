ols\">';\n  if(m==='fert') h+='<div class=\"field\" style=\"max-width:260px\"><label for=\"vsel\">الصنف<\/label><select id=\"vsel\">'+DATA.fert.map((p,i)=>'<option value=\"'+i+'\"'+(i===st.variety?' selected':'')+'>'+esc(p.variety)+'<\/option>').join('')+'<\/select><\/div>';\n  h+='<div class=\"field\"><label for=\"q\">اكتب أرقام أو اسم صنف (مثال: 1,3,5-8 أو يوريا)<\/label><input id=\"q\" type=\"search\" placeholder=\"رقم / نطاق / اسم\" value=\"'+esc(st.query)+'\"><\/div>';\n  h+='<button class=\"btn\" id=\"addq\">إضافة للتحديد<\/button><button class=\"btn ghost\" id=\"clr\">مسح التحديد<\/button><\/div>';\n  h+='<p class=\"hint\">اضغط على الأرقام لتحديد أكثر من اختيار. الأرقام مرتبة كما في الجدول من أعلى لأسفل.<\/p>';\n  if(m==='chem'){\n    DATA.chem.cats.forEach((c,ci)=>{ h+='<div class=\"groupname\">'+esc(c.name.trim())+'<\/div><div class=\"chips\">'+items.filter(i=>i.gi===ci).map(chip(sel)).join('')+'<\/div>'; });\n  } else h+='<div class=\"chips\">'+items.map(chip(sel)).join('')+'<\/div>';\n  h+='<\/div><div id=\"results\"><\/div>';\n  $('#view-search').innerHTML=h;\n  renderResults();\n}\nconst chip=sel=>i=>'<button class=\"chip\" data-id=\"'+i.id+'\" aria-pressed=\"'+sel.has(i.id)+'\" title=\"'+esc(i.title)+'\"><b>'+i.no+'<\/b><small>'+esc(st.mode==='chem'?i.title:st.mode==='fert'?i.title.replace('عمر ','').replace(' يوم (DAP)',''):(i.title.split(' – ')[0].replace('عمر ','').replace(' يوم','')+(i.type?' '+i.type:'')))+'<\/small><\/button>';\nfunction qtyTable(lines,a){\n  return '<table><thead><tr><th>الصنف<\/th><th class=\"n\">المعدل / فدان<\/th><th class=\"n\">الكمية للمساحة<\/th><\/tr><\/thead><tbody>'+\n   lines.map(l=>'<tr><td>'+esc(l.name)+(l.note?'<span class=\"note\">'+esc(l.note)+'<\/span>':'')+'<\/td><td class=\"n\">'+fmt(l.rate)+'<\/td><td class=\"n q\">'+fmt(l.rate*a)+'<\/td><\/tr>').join('')+'<\/tbody><\/table>';\n}\nfunction nutBlock(nut,a){\n  return '<div class=\"nutline\">'+NUTS.map((n,k)=>'<div class=\"u\"><i>'+n+'<\/i><b>'+fmt(nut[k],2)+'<\/b><em>'+fmt(nut[k]*a,2)+'<\/em><\/div>').join('')+'<\/div>';\n}\nfunction renderResults(){\n  const a=area(), items=curItems().filter(i=>st.sel[st.mode].has(i.id)), box=$('#results');\n  if(!items.length){box.innerHTML='<div class=\"empty\">لم يتم تحديد أي اختيار بعد.<br>اضغط على رقم من الأعلى أو اكتب الرقم في خانة البحث.<\/div>';return;}\n  let h='<div class=\"summarybar\"><span class=\"cnt\">'+items.length+' اختيار – المساحة '+fmt(a,2)+' فدان<\/span><span class=\"no-print\"><button class=\"btn ghost\" onclick=\"window.print()\">طباعة<\/button><\/span><\/div><div class=\"cards\">';\n  items.forEach(i=>{\n    h+='<article class=\"card\"><header><div><span class=\"no\">#'+i.no+'<\/span> <span class=\"ttl\">'+esc(i.title)+'<\/span>'+(i.spread?'<span class=\"tag\">Spread<\/span>':'')+'<\/div>'+\n       (i.group?'<div class=\"meta\">'+esc(i.group)+'<\/div>':st.mode==='fert'?'<div class=\"meta\">'+esc(DATA.fert[st.variety].variety)+'<\/div>':'')+'<\/header>'+\n       qtyTable(i.lines,a)+(i.nut?nutBlock(i.nut,a):'')+'<\/article>';\n  });\n  h+='<\/div>';\n  /* aggregate */\n  const agg=new Map(); items.forEach(i=>i.lines.forEach(l=>{const k=l.name.trim();const o=agg.get(k)||{rate:0,n:0};o.rate+=l.rate;o.n++;agg.set(k,o);}));\n  h+='<div class=\"totalbox\"><h3>إجمالي الأصناف المحددة ('+items.length+' اختيار)<\/h3><table><thead><tr><th>الصنف<\/th><th class=\"n\">عدد المرات<\/th><th class=\"n\">المعدل / فدان<\/th><th class=\"n\">الكمية للمساحة<\/th><\/tr><\/thead><tbody>'+\n    [...agg.entries()].sort((x,y)=>y[1].rate-x[1].rate).map(([k,o])=>'<tr><td>'+esc(k)+'<\/td><td class=\"n\">'+o.n+'<\/td><td class=\"n\">'+fmt(o.rate)+'<\/td><td class=\"n q\">'+fmt(o.rate*a)+'<\/td><\/tr>').join('')+'<\/tbody><\/table>';\n  if(st.mode==='fert'){\n    const t=NUTS.map((n,k)=>items.reduce((s,i)=>s+i.nut[k],0));\n    h+='<div class=\"nutline\"><div class=\"u\" style=\"flex:0 0 100%;border:0;background:none;text-align:right\"><i>إجمالي العناصر (وحدة/فدان ← للمساحة)<\/i><\/div>'+NUTS.map((n,k)=>'<div class=\"u\"><i>'+n+'<\/i><b>'+fmt(t[k],2)+'<\/b><em>'+fmt(t[k]*a,2)+'<\/em><\/div>').join('')+'<\/div>';\n  }\n  h+='<\/div>'+notesBlock();\n  box.innerHTML=h;\n}\nfunction notesBlock(){\n  const n=st.mode==='nut'?DATA.nut.notes:st.mode==='chem'?DATA.chem.notes:[];\n  return n.length?'<details class=\"notes\"><summary>ملاحظات الخطة ('+n.length+')<\/summary><ul>'+n.map(x=>'<li>'+esc(x)+'<\/li>').join('')+'<\/ul><\/details>':'';\n}\n\n/* ---------- full tab ---------- */\nfunction renderFull(){\n  const m=st.mode,a=area();\n  let h='<div class=\"panel\"><h2>المحتويات الشاملة – '+MODE_LABEL[m]+'<\/h2><div class=\"controls\">';\n  if(m==='fert') h+='<div class=\"field\" style=\"max-width:260px\"><label for=\"fv\">الصنف<\/label><select id=\"fv\">'+DATA.fert.map((p,i)=>'<option value=\"'+i+'\"'+(i===st.fvariety?' selected':'')+'>'+esc(p.variety)+'<\/option>').join('')+'<\/select><\/div>';\n  h+='<div class=\"field\" style=\"max-width:260px\"><label for=\"fq\">ابحث باسم صنف<\/label><input id=\"fq\" type=\"search\" placeholder=\"مثال: يوريا\" value=\"'+esc(st.fq)+'\"><\/div>';\n  if(m==='fert') h+='<div class=\"field\" style=\"max-width:260px\"><label for=\"fview\">طريقة العرض<\/label><select id=\"fview\"><option value=\"rate\"'+(st.fview==='rate'?' selected':'')+'>المعدل لكل فدان (كجم)<\/option><option value=\"qty\"'+(st.fview==='qty'?' selected':'')+'>الكمية للمساحة ('+fmt(a,2)+' فدان)<\/option><\/select><\/div>';\n  h+='<button class=\"btn ghost no-print\" onclick=\"window.print()\">طباعة<\/button><\/div>';\n  h+='<div class=\"legend\"><span>المساحة الحالية: <b>'+fmt(a,2)+' فدان<\/b><\/span><span>الوحدة كما في الجدول (كجم / لتر للفدان)<\/span><\/div><\/div>';\n  const q=st.fq.trim().toLowerCase();\n  if(m==='fert') h+=fullFert(a,q);\n  else if(m==='nut') h+=fullNut(a,q);\n  else h+=fullChem(a,q);\n  h+=notesBlock();\n  $('#view-full').innerHTML=h;\n}\nfunction fullFert(a,q){\n  const p=DATA.fert[st.fvariety],mul=st.fview==='qty'?a:1,d=st.fview==='qty'?2:3,T=totals(p);\n  const cols=p.products.map((n,k)=>q&&n.toLowerCase().includes(q)?k:-1).filter(k=>k>=0);\n  let h='<div class=\"tablewrap\"><table class=\"matrix\"><thead><tr><th>#<\/th><th>العمر<\/th>'+p.products.map((n,k)=>'<th class=\"prod n'+(cols.includes(k)?' colhl':'')+'\">'+esc(n)+'<\/th>').join('')+NUTS.map(n=>'<th class=\"n\">'+n+'<\/th>').join('')+'<\/tr><\/thead><tbody>';\n  p.rows.forEach(r=>{\n    const hl=cols.length&&cols.some(k=>r.amt[k]>0);\n    h+='<tr'+(hl?' class=\"hl\"':'')+'><td>'+r.no+'<\/td><td style=\"text-align:right;position:static;background:none;font-weight:400;border:0;border-bottom:1px solid var(--line)\">'+esc(r.label)+'<\/td>'+\n      r.amt.map(v=>'<td class=\"n'+(v?'':' zero')+'\">'+(v?fmt(v*mul,d):'·')+'<\/td>').join('')+r.nut.map(v=>'<td class=\"n nutc'+(v?'':' zero')+'\">'+(v?fmt(v*mul,2):'·')+'<\/td>').join('')+'<\/tr>';\n  });\n  h+='<tr class=\"tot\"><td>∑<\/td><td style=\"position:static;background:none;text-align:right;border:0\">إجمالي الموسم<\/td>'+T.amt.map(v=>'<td class=\"n\">'+(v?fmt(v*mul,d):'·')+'<\/td>').join('')+T.nut.map(v=>'<td class=\"n\">'+fmt(v*mul,2)+'<\/td>').join('')+'<\/tr><\/tbody><\/table><\/div>';\n  /* season totals */\n  const rows=p.products.map((n,k)=>({n,v:T.amt[k],c:p.rows.filter(r=>r.amt[k]>0).length})).filter(o=>o.v>0&&(!q||o.n.toLowerCase().includes(q)));\n  h+='<div class=\"totalbox\"><h3>إجمالي الموسم لكل صنف – '+esc(p.variety)+'<\/h3><table><thead><tr><th>الصنف<\/th><th class=\"n\">عدد التسميدات<\/th><th class=\"n\">كجم / فدان<\/th><th class=\"n\">كجم لـ '+fmt(a,2)+' فدان<\/th><\/tr><\/thead><tbody>'+\n    rows.map(o=>'<tr><td>'+esc(o.n)+'<\/td><td class=\"n\">'+o.c+'<\/td><td class=\"n\">'+fmt(o.v)+'<\/td><td class=\"n q\">'+fmt(o.v*a,2)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>';\n  return h;\n}\nfunction fullNut(a,q){\n  const apps=DATA.nut.apps;\n  let h='<div class=\"tablewrap\"><table><thead><tr><th class=\"n\">#<\/th><th>العمر<\/th><th>النوع<\/th><th>الصنف<\/th><th class=\"n\">المعدل / فدان<\/th><th class=\"n\">الكمية للمساحة<\/th><\/tr><\/thead><tbody>';\n  apps.forEach(ap=>{\n    const its=ap.items.filter(i=>!q||i.name.toLowerCase().includes(q)); if(!its.length) return;\n    its.forEach((i,ix)=>{ h+='<tr>'+(ix===0?'<td class=\"n\" rowspan=\"'+its.length+'\"><b>'+ap.no+'<\/b><\/td><td rowspan=\"'+its.length+'\">'+esc(ap.age)+'<\/td><td rowspan=\"'+its.length+'\"><span class=\"tag\" style=\"margin:0\">'+esc(ap.type)+'<\/span><\/td>':'')+\n      '<td>'+esc(i.name)+(i.note?'<span class=\"note\">'+esc(i.note)+'<\/span>':'')+'<\/td><td class=\"n\">'+fmt(i.rate)+'<\/td><td class=\"n q\">'+fmt(i.rate*a)+'<\/td><\/tr>'; });\n  });\n  h+='<\/tbody><\/table><\/div>';\n  const agg=new Map(); apps.forEach(ap=>ap.items.forEach(i=>{const k=i.name.trim()+'|'+ap.type;const o=agg.get(k)||{n:i.name.trim(),t:ap.type,r:0,c:0,opt:0};o.r+=i.rate;o.c++;if(i.note)o.opt++;agg.set(k,o);}));\n  const rows=[...agg.values()].filter(o=>!q||o.n.toLowerCase().includes(q)).sort((x,y)=>x.t.localeCompare(y.t)||y.r-x.r);\n  h+='<div class=\"totalbox\"><h3>إجمالي الموسم لكل صنف<\/h3><table><thead><tr><th>الصنف<\/th><th>النوع<\/th><th class=\"n\">عدد المرات<\/th><th class=\"n\">إجمالي / فدان<\/th><th class=\"n\">إجمالي للمساحة<\/th><\/tr><\/thead><tbody>'+\n    rows.map(o=>'<tr><td>'+esc(o.n)+(o.opt?'<span class=\"note\">منها '+o.opt+' مرة \"في حالة وجود رصيد\"<\/span>':'')+'<\/td><td>'+esc(o.t)+'<\/td><td class=\"n\">'+o.c+'<\/td><td class=\"n\">'+fmt(o.r)+'<\/td><td class=\"n q\">'+fmt(o.r*a)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>';\n  return h;\n}\nfunction fullChem(a,q){\n  let h='';\n  DATA.chem.cats.forEach(c=>{\n    const its=c.items.filter(i=>!q||i.name.toLowerCase().includes(q)); if(!its.length) return;\n    h+='<div class=\"catblock\"><h3>'+esc(c.name.trim())+(c.age&&isNaN(c.age)?' <span class=\"tag\">'+esc(c.age)+'<\/span>':'')+'<\/h3><div class=\"tablewrap\"><table><thead><tr><th class=\"n\">#<\/th><th>المبيد<\/th><th class=\"n\">المعدل / فدان<\/th><th class=\"n\">الكمية للمساحة<\/th><th>ملاحظات<\/th><\/tr><\/thead><tbody>'+\n      its.map(i=>'<tr><td class=\"n\"><b>'+i.no+'<\/b><\/td><td>'+esc(i.name)+'<\/td><td class=\"n\">'+fmt(i.rate)+'<\/td><td class=\"n q\">'+fmt(i.rate*a)+'<\/td><td>'+esc(i.note||'')+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><\/div>';\n  });\n  return h||'<div class=\"empty\">لا توجد نتائج مطابقة.<\/div>';\n}\n\n/* ---------- wiring ---------- */\nfunction render(){\n  document.body.dataset.mode=st.mode;\n  document.querySelectorAll('#modeseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===st.mode));\n  document.querySelectorAll('.maintabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===st.tab));\n  st.variety=Math.min(st.variety,DATA.fert.length-1);st.fvariety=Math.min(st.fvariety,DATA.fert.length-1);\n  $('#view-search').hidden=st.tab!=='search'; $('#view-full').hidden=st.tab!=='full'; $('#view-edit').hidden=st.tab!=='edit';\n  if(st.tab==='search') renderSearch(); else if(st.tab==='full') renderFull(); else renderEdit();\n}\ndocument.querySelectorAll('#modeseg button').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;st.query='';st.forgot=false;render();});\ndocument.querySelectorAll('.maintabs button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;render();window.scrollTo(0,0);});\n$('#area').addEventListener('input',()=>{try{localStorage.setItem('pivotArea',$('#area').value)}catch(e){} if(st.tab==='search')renderResults();else if(st.tab==='full')renderFull();});\ndocument.addEventListener('click',e=>{\n  const c=e.target.closest('.chip'); if(c){const s=st.sel[st.mode],id=c.dataset.id; s.has(id)?s.delete(id):s.add(id); c.setAttribute('aria-pressed',s.has(id)); renderResults(); return;}\n  if(e.target.id==='clr'){st.sel[st.mode].clear();st.query='';renderSearch();}\n  if(e.target.id==='addq'){addQuery();}\n});\nfunction addQuery(){const ids=parseQuery($('#q').value,curItems());ids.forEach(i=>st.sel[st.mode].add(i));st.query='';renderSearch();}\ndocument.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')addQuery();});\ndocument.addEventListener('change',e=>{\n  if(e.target.id==='vsel'){st.variety=+e.target.value;st.sel.fert.clear();renderSearch();}\n  if(e.target.id==='fv'){st.fvariety=+e.target.value;renderFull();}\n  if(e.target.id==='fview'){st.fview=e.target.value;renderFull();}\n});\ndocument.addEventListener('input',e=>{\n  if(e.target.id==='q')st.query=e.target.value;\n  if(e.target.id==='fq'){st.fq=e.target.value;const pos=e.target.selectionStart;renderFull();const f=$('#fq');f.focus();f.setSelectionRange(pos,pos);}\n});\n/* ================= EDIT TAB (PIN protected) ================= */\nst.evariety=0; st.unlocked=false; st.forgot=false; st.last=Date.now();\nconst LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};\nconst getAuth=()=>{try{return JSON.parse(LS.get('pl_auth')||'null')}catch(e){return null}};\nconst putAuth=a=>LS.set('pl_auth',JSON.stringify(a));\nconst jget=(k,d)=>{try{return JSON.parse(LS.get(k)||'null')||d}catch(e){return d}};\nconst mask=m=>{const [u,d]=(m||'').split('@');return u?u[0]+'•••@'+d:''};\nconst isGmail=m=>/^[a-z0-9._%+-]+@(gmail|googlemail)\\.com$/i.test((m||'').trim());\nfunction setMsg(t,ok){const m=$('#emsg');if(m){m.textContent=t;m.className='msg '+(ok?'ok':'bad');}}\nfunction toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1700);}\nasync function sha(s){\n  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}\n  let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}\n  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);\n  return 'x'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);\n}\nconst rnd=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');\nconst stampAct=()=>{st.last=Date.now();};\nsetInterval(()=>{if(st.unlocked&&Date.now()-st.last>10*60000){st.unlocked=false;toast('تم قفل التعديل تلقائيًا');if(st.tab==='edit')renderEdit();}},30000);\n\nfunction renumber(){DATA.fert.forEach(p=>p.rows.forEach((r,i)=>r.no=i+1));DATA.nut.apps.forEach((a,i)=>a.no=i+1);}\nfunction totals(p){return {amt:p.products.map((_,k)=>p.rows.reduce((s,r)=>s+(r.amt[k]||0),0)),nut:NUTS.map((_,n)=>p.rows.reduce((s,r)=>s+(r.nut[n]||0),0))};}\nfunction calcRow(p,r){r.nut=NUTS.map((_,n)=>Math.round(p.products.reduce((s,_p,k)=>s+(r.amt[k]||0)*((p.comp[k]||[])[n]||0)/100,0)*1e6)/1e6);}\nfunction saveData(){renumber();const ok=LS.set('pl_data',JSON.stringify(DATA));stampAct();toast(ok?'تم الحفظ':'تعذر الحفظ في هذا المتصفح');}\nlet saveT;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(saveData,500);};\nconst rerenderKeep=()=>{const y=window.scrollY;renderEdit();window.scrollTo(0,y);};\n\n/* ---- screens ---- */\nfunction setupHTML(){return '<div class=\"panel\"><h2>إنشاء رقم سري للتعديل<\/h2><p class=\"hint\">لا يمكن تعديل الجداول إلا بعد إدخال الرقم السري. اختر رقمًا من 4 خانات على الأقل واكتب حساب Gmail الخاص بك لاستعادة الرقم عند نسيانه.<\/p><div class=\"controls\"><div class=\"field\"><label for=\"np\">الرقم السري<\/label><input id=\"np\" type=\"password\" inputmode=\"numeric\" autocomplete=\"new-password\"><\/div><div class=\"field\"><label for=\"np2\">تأكيد الرقم السري<\/label><input id=\"np2\" type=\"password\" inputmode=\"numeric\" autocomplete=\"new-password\"><\/div><\/div><div class=\"controls\"><div class=\"field\"><label for=\"em\">حساب Gmail للاستعادة<\/label><input id=\"em\" type=\"email\" placeholder=\"name@gmail.com\" autoco " style=\"max-width:220px\"><label for=\"wp\">تأكيد<\/label><input id=\"wp\"><\/div><button class=\"btn\" data-act=\"wipe\">مسح وإعادة الضبط<\/button><\/div>';\n  }\n  return h+'<div class=\"controls\"><button class=\"btn ghost\" data-act=\"back\">رجوع<\/button><\/div><div id=\"emsg\" class=\"msg\"><\/div><\/div>';\n}\n\n/* ---- auth actions ---- */\nasync function doSetup(){\n  const pin=$('#np').value,c=$('#np2').value,mail=$('#em').value.trim();\n  if(pin.length<4) return setMsg('الرقم السري لازم يكون 4 خانات على الأقل',false);\n  if(pin!==c) return setMsg('الرقمان غير متطابقين',false);\n  if(!isGmail(mail)) return setMsg('اكتب عنوان Gmail صحيح مثل name@gmail.com',false);\n  const salt=rnd();putAuth({salt,hash:await sha(salt+':'+pin),email:mail,script:''});\n  st.unlocked=true;stampAct();renderEdit();toast('تم إنشاء الرقم السري');\n}\nasync function doUnlock(){\n  const a=getAuth(),f=jget('pl_fail',{n:0,until:0});\n  if(Date.now()<f.until) return setMsg('محاولات كثيرة. انتظر '+Math.ceil((f.until-Date.now())/1000)+' ثانية',false);\n  if(await sha(a.salt+':'+$('#lp').value)===a.hash){LS.del('pl_fail');st.unlocked=true;stampAct();renderEdit();return;}\n  f.n++;if(f.n>=5)f.until=Date.now()+Math.min(30*Math.pow(2,f.n-5),3600)*1000;LS.set('pl_fail',JSON.stringify(f));\n  setMsg('الرقم السري غير صحيح'+(f.n>=5?' – تم إيقاف المحاولات مؤقتًا':''),false);\n}\nasync function doSendCode(kind){\n  const a=getAuth();if(!a||!a.script) return setMsg('أدخل رابط Google Script أولًا',false);\n  const code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);\n  try{await fetch(a.script,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code,kind})});}\n  catch(e){return setMsg('تعذر الاتصال بالإنترنت. حاول مرة أخرى',false);}\n  if(kind==='reset'){const salt=rnd();LS.set('pl_reset',JSON.stringify({salt,hash:await sha(salt+':'+code),exp:Date.now()+15*60000,tries:0}));renderEdit();}\n  setMsg('تم إرسال الطلب إلى '+mask(a.email)+'. راجع الوارد وكذلك الرسائل غير المرغوبة (قد يستغرق دقيقة).',true);\n}\nasync function doResetPin(){\n  const r=jget('pl_reset',null),a=getAuth();\n  if(!r||Date.now()>r.exp) return setMsg('الكود منتهي. اطلب كودًا جديدًا',false);\n  if(r.tries>=5){LS.del('pl_reset');renderEdit();setMsg('محاولات كثيرة. اطلب كودًا جديدًا',false);return;}\n  if(await sha(r.salt+':'+$('#rc').value.trim())!==r.hash){r.tries++;LS.set('pl_reset',JSON.stringify(r));return setMsg('الكود غير صحيح',false);}\n  const pin=$('#np').value;\n  if(pin.length<4) return setMsg('الرقم الجديد لازم يكون 4 خانات على الأقل',false);\n  if(pin!==$('#np2').value) return setMsg('الرقمان غير متطابقين',false);\n  a.salt=rnd();a.hash=await sha(a.salt+':'+pin);putAuth(a);LS.del('pl_reset');LS.del('pl_fail');\n  st.forgot=false;st.unlocked=true;stampAct();renderEdit();toast('تم تعيين الرقم السري الجديد');\n}\nfunction doWipe(){\n  if($('#wp').value.trim()!=='مسح') return setMsg('اكتب كلمة مسح للتأكيد',false);\n  ['pl_auth','pl_reset','pl_fail','pl_data'].forEach(k=>LS.del(k));\n  DATA=JSON.parse(JSON.stringify(DATA_BASE));st.forgot=false;st.unlocked=false;renderEdit();toast('تمت إعادة الضبط');\n}\n\n/* ---- editor screens ---- */\nconst GS_CODE=`function doPost(e) {\n  var cache = CacheService.getScriptCache();\n  if (cache.get('busy')) return ContentService.createTextOutput('busy');\n  cache.put('busy', '1', 30);\n  var d = JSON.parse(e.postData.contents);\n  if (!/^\\\\d{6}$/.test(String(d.code))) return ContentService.createTextOutput('bad');\n  var me = Session.getEffectiveUser().getEmail();\n  var subject = d.kind === 'test' ? 'تجربة كود الاستعادة' : 'كود استعادة الرقم السري';\n  var body = 'الكود: ' + d.code + '\\\\nصالح لمدة 15 دقيقة. إذا لم تطلبه تجاهل هذه الرسالة.';\n  MailApp.sendEmail(me, subject, body);\n  return ContentService.createTextOutput('ok');\n}`;\nfunction editorHTML(){\n  const a=getAuth(),m=st.mode;\n  let h='<div class=\"panel\"><div class=\"controls\" style=\"align-items:center\" abel><input id=\"op\" type=\"password\" inputmode=\"numeric\"><\/div><div class=\"field\"><label for=\"cp\">الرقم الجديد<\/label><input id=\"cp\" type=\"password\" inputmode=\"numeric\"><\/div><div class=\"field\"><label for=\"cp2\">تأكيد الجديد<\/label><input id=\"cp2\" type=\"password\" inputmode=\"numeric\"><\/div><button class=\"btn\" data-act=\"chpin\">تغيير<\/button><\/div><\/details>';\n  return h+(m==='fert'?fertEd():m==='nut'?nutEd():chemEd());\n}\nfunction fertEd(){\n  const p=DATA.fert[st.evariety],T=totals(p);\n  let h='<div class=\"panel\"><h2>خطة التسميد<\/h2><div class=\"controls\"><div class=\"field\" style=\"max-width:240px\"><label for=\"evs\">الصنف<\/label><select id=\"evs\">'+DATA.fert.map((v,i)=>'<option value=\"'+i+'\"'+(i===st.evariety?' selected':'')+'>'+esc(v.variety)+'<\/option>').join('')+'<\/select><\/div>'+\n   '<div class=\"field\" style=\"max-width:240px\"><label>اسم الصنف<\/label><input class=\"ed\" data-k=\"vname\" value=\"'+esc(p.variety)+'\"><\/div><button class=\"btn ghost\" data-act=\"vdup\">نسخ هذه الخطة كصنف جديد<\/button>'+(DATA.fert.length>1?'<button class=\"btn ghost\" data-act=\"vdel\">حذف الصنف<\/button>':'')+'<\/div>'+\n   '<p class=\"hint\">عدّل الكميات (كجم/فدان). وحدات N وP2O5 وK2O وCaO وMgO تُحسب تلقائيًا من تركيب كل سماد. أرقام التسميدات تُعاد ترتيبها تلقائيًا.<\/p><\/div>';\n  h+='<details class=\"notes\" style=\"margin:0 0 14px\"><summary>تركيب الأسمدة (% من كل عنصر)<\/summary><div class=\"tablewrap\" style=\"margin-top:8px\"><table class=\"matrix ed\"><thead><tr><th>العنصر<\/th>'+p.products.map(n=>'<th class=\"prod n\">'+esc(n)+'<\/th>').join('')+'<\/tr><\/thead><tbody>'+\n   NUTS.map((nn,n)=>'<tr><td>'+nn+'<\/td>'+p.products.map((_,k)=>'<td class=\"n\"><input class=\"num ed\" type=\"number\" step=\"any\" min=\"0\" data-k=\"comp\" data-c=\"'+k+'\" data-n=\"'+n+'\" value=\"'+((p.comp[k]||[])[n]||0)+'\"><\/td>').join('')+'<\/tr>').join('')+'<\/tbody><\/table><\/div><p class=\"hint\" style=\"margin-top:8px\">القيم المحسوبة من خطتك الأصلية دقيقة للأصناف المستخدمة. الأصناف غير المستخدمة (ماب، سلفات نشادر، نترات ماغنسيوم، نترات بوتاسيوم) وُضعت لها قيم قياسية قابلة للتعديل.<\/p><\/details>';\n  h+='<div class=\"tablewrap\"><table class=\"matrix ed\"><thead><tr><th>#<\/th><th>إجراءات<\/th><th>العمر / المرحلة<\/th>'+p.products.map((n,k)=>'<th class=\"prod\"><input class=\"ed pn\" data-k=\"pname\" data-c=\"'+k+'\" value=\"'+esc(n)+'\"><button class=\"mini\" data-act=\"fcoldel\" data-c=\"'+k+'\" title=\"حذف هذا الصنف\">✖<\/button><\/th>').join('')+NUTS.map(n=>'<th class=\"n\">'+n+'<\/th>').join('')+'<\/tr><\/thead><tbody>';\n  p.rows.forEach((r,i)=>{\n    h+='<tr><td>'+r.no+'<\/td><td style=\"position:static;background:none;font-weight:400;white-space:nowrap\"><button class=\"mini\" data-act=\"fup\" data-r=\"'+i+'\">▲<\/button><button class=\"mini\" data-act=\"fdn\" data-r=\"'+i+'\">▼<\/button><button class=\"mini\" data-act=\"fins\" data-r=\"'+i+'\" title=\"إضافة بعده\">＋<\/button><button class=\"mini\" data-act=\"fdel\" data-r=\"'+i+'\">✖<\/button><\/td>'+\n     '<td style=\"position:static;background:none;font-weight:400\"><input class=\"ed lab\" data-k=\"label\" data-r=\"'+i+'\" value=\"'+esc(r.label)+'\"><\/td>'+\n     p.products.map((_,k)=>'<td class=\"n\"><input class=\"num ed\" type=\"number\" step=\"any\" min=\"0\" data-k=\"amt\" data-r=\"'+i+'\" data-c=\"'+k+'\" value=\"'+(r.amt[k]||'')+'\"><\/td>').join('')+\n     NUTS.map((_,n)=>'<td class=\"n nutc\" data-nut=\"'+i+'-'+n+'\">'+(r.nut[n]?fmt(r.nut[n],2):'·')+'<\/td>').join('')+'<\/tr>';\n  });\n  h+='<tr class=\"tot\"><td>∑<\/td><td><\/td><td style=\"position:static;background:none;text-align:right\">الإجمالي<\/td>'+T.amt.map((v,k)=>'<td class=\"n\" data-tot=\"a'+k+'\">'+(v?fmt(v,3):'·')+'<\/td>').join('')+T.nut.map((v,n)=>'<td class=\"n\" data-tot=\"n'+n+'\">'+fmt(v,2)+'<\/td>').join('')+'<\/tr><\/tbody><\/table><\/div>'+\n   '<div class=\"controls\" style=\"margin-top:12px\"><button class=\"btn\" data-act=\"fadd\">+ إضافة تسميدة في النهاية<\/button><button class=\"btn ghost\" data-act=\"fcoladd\">+ إضافة سماد جديد (عمود)<\/button><\/div>';\n  return h;\n}\nfunction updDerived(){\n  const p=DATA.fert[st.evariety];p.rows.forEach(r=>calcRow(p,r));\n  p.rows.forEach((r,i)=>NUTS.forEach((_,n)=>{const c=document.querySelector('[data-nut=\"'+i+'-'+n+'\"]');if(c)c.textContent=r.nut[n]?fmt(r.nut[n],2):'·';}));\n  const T=totals(p);\n  T.amt.forEach((v,k)=>{const c=document.querySelector('[data-tot=\"a'+k+'\"]');if(c)c.textContent=v?fmt(v,3):'·';});\n  T.nut.forEach((v,n)=>{const c=document.querySelector('[data-tot=\"n'+n+'\"]');if(c)c.textContent=fmt(v,2);});\n}\nconst tb=(act,attrs,t)=>'<button class=\"mini\" data-act=\"'+act+'\" '+attrs+'>'+t+'<\/button>';\nfunction nutEd(){\n  const apps=DATA.nut.apps;\n  let h='<datalist id=\"types\"><option value=\"رش\"><option value=\"حقن\"><\/datalist><div class=\"panel\"><h2>خطة المغذيات<\/h2><p class=\"hint\">كل موعد له رقم تلقائي حسب ترتيبه. المعدل لكل فدان.<\/p><\/div>';\n  apps.forEach((ap,a)=>{\n    h+='<div class=\"catblock\"><h3 style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><span>#'+ap.no+'<\/span><input class=\"ed\" style=\"width:130px\" data-k=\"nage\" data-a=\"'+a+'\" value=\"'+esc(ap.age)+'\" placeholder=\"العمر\"><input class=\"ed\" style=\"width:90px\" list=\"types\" data-k=\"ntype\" data-a=\"'+a+'\" value=\"'+esc(ap.type)+'\" placeholder=\"النوع\"><span style=\"flex:1\"><\/span>'+tb('nup','data-a=\"'+a+'\"','▲')+tb('ndn','data-a=\"'+a+'\"','▼')+tb('ndel','data-a=\"'+a+'\"','حذف الموعد')+'<\/h3><div class=\"tablewrap\"><table class=\"ed\"><thead><tr><th>الصنف<\/th><th class=\"n\">المعدل / فدان<\/th><th>ملاحظة<\/th><th><\/th><\/tr><\/thead><tbody>'+\n     ap.items.map((it,i)=>'<tr><td><input class=\"ed\" data-k=\"iname\" data-a=\"'+a+'\" data-i=\"'+i+'\" value=\"'+esc(it.name)+'\"><\/td><td class=\"n\"><input class=\"num ed\" type=\"number\" step=\"any\" min=\"0\" data-k=\"irate\" data-a=\"'+a+'\" data-i=\"'+i+'\" value= ('ciadd','data-a=\"'+a+'\"','+ إضافة مبيد')+'<\/div><\/div>';\n  });\n  return h+'<div class=\"controls\"><button class=\"btn\" data-act=\"cadd\">+ إضافة فئة جديدة<\/button><\/div>'+notesEd('chem');\n}\nconst notesEd=m=>'<div class=\"panel\"><h2>الملاحظات (سطر لكل ملاحظة)<\/h2><textarea class=\"ed\" rows=\"6\" data-k=\"notes\" data-m=\"'+m+'\" style=\"width:100%\">'+esc((DATA[m].notes||[]).join('\\n'))+'<\/textarea><\/div>';\n\nfunction renderEdit(){\n  const box=$('#view-edit'),a=getAuth();\n  box.innerHTML=!a?setupHTML():!st.unlocked?lockHTML():editorHTML();\n}\n\n/* ---- file helpers ---- */\nfunction download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove();},500);}\nconst stamp=()=>new Date().toISOString().slice(0,10);\nfunction exportHTML(){\n  const js=document.getElementById('appjs').textContent,S='/*DATA'+'_START*/',E='/*DATA'+'_END*/',i=js.indexOf(S),j=js.indexOf(E);\n  if(i<0||j<0) return setMsg('تعذر إنشاء الملف',false);\n  const clone=document.documentElement.cloneNode(true);\n  clone.querySelector('#appjs').textContent=js.slice(0,i+S.length)+JSON.stringify(DATA).replace(/<\\//g,'<\\\\/')+js.slice(j);\n  ['#view-search','#view-full','#view-edit'].forEach(s=>{clone.querySelector(s).innerHTML='';});\n  clone.querySelector('#view-search').removeAttribute('hidden');clone.querySelector('#view-full').setAttribute('hidden','');clone.querySelector('#view-edit').setAttribute('hidden','');\n  clone.querySelector('body').setAttribute('data-mode','fert');clone.querySelector('#toast').textContent='';clone.querySelector('#toast').className='toast';\n  download('fertilizer_spray_planner_'+stamp()+'.html','<!DOCTYPE html>\\n'+clone.outerHTML,'text/html');\n  setMsg('تم تنزيل الملف المحدّث. الرقم السري لا يُنقل مع الملف ويُنشأ من جديد على كل جهاز.',true);\n}\n\n/* ---- events ---- */\nconst mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;};\nconst ACT={\n  setup:doSetup,unlock:doUnlock,\n  forgot(){st.forgot=true;renderEdit();},back(){st.forgot=false;renderEdit();},\n  sendcode:()=>doSendCode('reset'),resetpin:doResetPin,wipe:doWipe,\n  lock(){st.unlocked=false;renderEdit();},\n  exjson(){download('plans_backup_'+stamp()+'.json',JSON.stringify(DATA,null,1),'application/json');setMsg('تم تنزيل النسخة الاحتياطية',true);},\n  imjson(){$('#impf').click();},\n  exhtml:exportHTML,\n  resetdata(){if(!confirm('سيتم حذف كل تعديلاتك والرجوع للجداول الأصلية. متأكد؟'))return;LS.del('pl_data');DATA=JSON.parse(JSON.stringify(DATA_BASE));st.evariety=0;renderEdit();toast('تمت استعادة الجداول الأصلية');},\n  copygs(){try{navigator.clipboard.writeText(GS_CODE).then(()=>setMsg('تم نسخ الكود',true),()=>setMsg('تعذر النسخ، حدد الكود وانسخه يدويًا',false));}catch(e){setMsg('تعذر النسخ، حدد الكود وانسخه يدويًا',false);}},\n  savesec(){const a=getAuth(),m=$('#sm').value.trim(),s=$('#ss').value.trim();\n    if(!isGmail(m))return setMsg('عنوان Gmail غير صحيح',false);\n    if(s&&!/^https:\\/\\/script\\.google\\.com\\/macros\\/s\\/[\\w-]+\\/exec$/.test(s))return setMsg('رابط السكربت غير صحيح (يجب أن ينتهي بـ /exec)',false);\n    a.email=m;a.script=s;putAuth(a);setMsg('تم حفظ إعدادات الاستعادة',true);},\n  testmail(){const a=getAuth();a.email=$('#sm').value.trim();a.script=$('#ss').value.trim();putAuth(a);doSendCode('test');},\n  async chpin(){const a=getAuth();\n    if(await sha(a.salt+':'+$('#op').value)!==a.hash)return setMsg('الرقم الحالي غير صحيح',false);\n    const n=$('#cp').value;if(n.length<4)return setMsg('الرقم الجديد لازم يكون 4 خانات على الأقل',false);\n    if(n!==$('#cp2').value)return setMsg('الرقمان غير متطابقين',false);\n    a.salt=rnd();a.hash=await sha(a.salt+':'+n);putAuth(a);['op','cp','cp2'].forEach(i=>$('#'+i).value='');setMsg('تم تغيير الرقم السري',true);},\n  /* fertilizer */\n  fadd(){const p=DATA.fe const views=document.getElementById('views'),tabs=[...document.querySelectorAll('#tabs button')];
const $b=id=>document.getElementById(id);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
/* التفضيلات: ثابتة ولا تتبع لغة/ثيم النظام */
const PREF={theme:'light',lang:'ar'};
(()=>{const t=ls.g('ts_theme'),l=ls.g('ts_lang');if(t==='dark'||t==='light')PREF.theme=t;if(l==='en'||l==='ar')PREF.lang=l})();
const tx=(k,o)=>{let s=(TXT[PREF.lang]||TXT.ar)[k]||k;if(o)for(const x in o)s=s.replace('{'+x+'}',o[x]);return s};
let curTab='pivot';
function applyShell(){
  const h=document.documentElement;h.lang=PREF.lang;h.dir=PREF.lang==='ar'?'rtl':'ltr';h.setAttribute('data-theme',PREF.theme);
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tx(e.dataset.t));
  $b('tool').textContent=tx('t_'+curTab);
  $b('tbtn').textContent=PREF.theme==='dark'?'☀️':'🌙';$b('tbtn').setAttribute('aria-label',tx('a_theme'));$b('tbtn').title=tx('a_theme');
  $b('lbtn').textContent=PREF.lang==='ar'?'EN':'ع';$b('lbtn').setAttribute('aria-label',tx('a_lang'));$b('lbtn').title=tx('a_lang');
  $b('ibtn').setAttribute('aria-label',tx('a_inst'));$b('ibtn').title=tx('a_inst');
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=PREF.theme==='dark'?'#202719':'#ffffff';
  $b('bbtn').setAttribute('aria-label',tx('a_bk'));$b('bbtn').title=tx('a_bk');
}
function pushPrefs(){views.querySelectorAll('iframe').forEach(f=>{try{f.contentWindow.postMessage({ts:{theme:PREF.theme,lang:PREF.lang}},'*')}catch(e){}})}
function setPref(k,v){PREF[k]=v;ls.s('ts_'+k,v);applyShell();pushPrefs();status();mirror()}
function mkDoc(k){
  const init='<script>window.__TS='+JSON.stringify({theme:PREF.theme,lang:PREF.lang})+';var d=document.documentElement;d.setAttribute("data-theme",window.__TS.theme);d.lang=window.__TS.lang;d.dir=window.__TS.lang==="ar"?"rtl":"ltr"<\/script>';
  return APPS[k].replace('<head>','<head>'+init);
}
function show(k){
  curTab=k;
  tabs.forEach(b=>{const on=b.dataset.k===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  [...views.children].forEach(f=>f.classList.toggle('on',f.dataset.k===k));
  let f=views.querySelector('[data-k="'+k+'"]');
  if(!f){f=document.createElement('iframe');f.dataset.k=k;f.title=k;f.className='on';f.srcdoc=mkDoc(k);views.appendChild(f)}
  $b('tool').textContent=tx('t_'+k);
  ls.s('athmar_tab',k);
}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.k));
$b('tbtn').onclick=()=>setPref('theme',PREF.theme==='dark'?'light':'dark');
$b('lbtn').onclick=()=>setPref('lang',PREF.lang==='ar'?'en':'ar');

/* ===== حماية البيانات ===== */
const KEYS=['pivot-brands','pivot-pl','pivotEntryV1','pi','athmar_sprout_v1','harvest_v1','pivotS','pivot-map-v2','pl_data','pivotArea','density_v1','ts_theme','ts_lang'];
function snap(){const d={};KEYS.forEach(k=>{const v=ls.g(k);if(v!==null)d[k]=v});return d}
function hasData(d){return Object.keys(d).some(k=>k!=='ts_theme'&&k!=='ts_lang')}
function idb(fn){return new Promise(res=>{try{const r=indexedDB.open('athmar_backup',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onerror=()=>res(null);r.onsuccess=()=>{try{fn(r.result,res)}catch(e){res(null)}}}catch(e){res(null)}})}
const idbPut=d=>idb((db,res)=>{const t=db.transaction('s','readwrite');t.objectStore('s').put({t:Date.now(),d},'snap');t.oncomplete=()=>res(1);t.onerror=()=>res(null)});
const idbGet=()=>idb((db,res)=>{const q=db.transaction('s').objectStore('s').get('snap');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)});
let lastMirror='';
function mirror(){const d=snap(),j=JSON.stringify(d);if(j===lastMirror||!hasData(d))return;lastMirror=j;idbPut(d)}
function setRow(s,w){const r=$b('bstrow');r.textContent=s||'';r.classList.toggle('warn',!!w);r.style.display=(s&&w)?'block':'none'}
function status(){
  const t=+ls.g('athmar_lastbackup')||0,d=snap();let s,w=false;
  if(!hasData(d)){s=tx('s_none')}
  else if(!t){s=tx('s_nobk');w=true}
  else{const days=Math.floor((Date.now()-t)/864e5);s=days<1?tx('s_today'):tx('s_ago',{n:days});if(days>=7){s='⚠️ '+s+tx('s_new');w=true}}
  setRow(s,w);return s}
async function persist(){let p=tx('p_na');try{if(navigator.storage&&navigator.storage.persist){p=(await navigator.storage.persist())?tx('p_ok'):tx('p_no')}}catch(e){}return p}
async function openDlg(){$b('msg').textContent='';$b('dlg').classList.add('on');$b('info').textContent=tx('i_checking');const p=await persist();$b('info').innerHTML=tx('i_body',{p:p,s:status()})}
async function doExport(){
  const d=snap();if(!hasData(d)){$b('msg').textContent=tx('m_nodata');return}
  const txt=JSON.stringify({app:'athmar',v:1,t:new Date().toISOString(),data:d},null,1);
  const name='firmo_backup_'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([txt],name,{type:'application/json'});let done=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done=true}}catch(e){if(e&&e.name==='AbortError')return}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  ls.s('athmar_lastbackup',Date.now());status();$b('msg').textContent=tx('m_saved')}
function reloadViews(){const cur=curTab;[...views.children].forEach(f=>f.remove());show(cur)}
function applyData(d){Object.keys(d).forEach(k=>{if(KEYS.includes(k)&&typeof d[k]==='string'&&k!=='ts_theme'&&k!=='ts_lang')ls.s(k,d[k])});reloadViews();mirror();status()}
$b('bf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j||j.app!=='athmar'||!j.data)throw 0;
    const n=Object.keys(j.data).filter(k=>KEYS.includes(k)).length;
    if(!confirm(tx('m_conf',{n:n})))return;
    applyData(j.data);$b('msg').textContent=tx('m_restored')}
  catch(err){$b('msg').textContent=tx('m_bad')}};
$b('bbtn').onclick=openDlg;$b('bc').onclick=()=>$b('dlg').classList.remove('on');
$b('brand').onclick=()=>{location.href='about.html'};
$b('about-close').onclick=()=>$b('about').style.display='none';
$b('about').onclick=e=>{if(e.target.id==='about')$b('about').style.display='none'};
function openAbout(){
  $b('about-title').textContent=tx('about_title');
  $b('about-body').innerHTML=tx('about_body');
  $b('about-close').textContent=tx('d_close');
  $b('about').style.display='flex';
}

$b('dlg').onclick=e=>{if(e.target.id==='dlg')$b('dlg').classList.remove('on')};
$b('bx').onclick=doExport;$b('br').onclick=()=>$b('bf').click();

/* ===== PWA ===== */
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$b('ibtn').hidden=false});
addEventListener('appinstalled',()=>{dp=null;$b('ibtn').hidden=true});
$b('ibtn').onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;return}alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?tx('d_ios'):tx('d_inst'))};
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
$b('ibtn').hidden=standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone&&/^https?:$/.test(location.protocol))$b('inst').hidden=false;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)setRow(tx('m_upd'),true);had=true});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{try{r.update()}catch(e){}}).catch(()=>{}));
}

applyShell();
let k0='pivot';try{k0=ls.g('athmar_tab')||k0}catch(e){}
if(APPS[location.hash.slice(1)])k0=location.hash.slice(1);
show(APPS[k0]?k0:'pivot');
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!hasData(snap())){const r=await idbGet();if(r&&r.d&&hasData(r.d)){applyData(r.d);setRow(tx('m_auto'),true)}}
  else status();
  mirror();
})();
setInterval(mirror,15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)mirror()});
addEventListener('pagehide',mirror);
</script>
